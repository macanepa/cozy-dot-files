[General]
# Background image (relative to this theme dir). scripts/sddm-sync.sh swaps this
# for the current cozy-dot-files theme's wallpaper.
background=backgrounds/bg.jpg

# Palette — read by Main.qml as config.<key>. Defaults are an elegant neutral
# dark with a soft sage accent (the cozy heritage). sddm-sync.sh rewrites these
# from themes.json so the login screen follows your active theme.
bg=#0E0F11
fg=#E8EBEA
fgDim=#828B89
accent=#A7BCB1
field=#15181A
border=#2A2E30
